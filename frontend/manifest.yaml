# ==============================================================================
# 1. CONFIGMAP (Nginx Reverse Proxy Configuration & Microservice Routing)
# ==============================================================================
# - Decouples the Nginx web server configuration from the container image.
# - Injects custom routing rules to proxy API requests (/api/*) to respective backend
#   microservice internal ClusterIP DNS names (e.g. catalogue:8080, cart:8080).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend                   # Name of the ConfigMap
  namespace: roboshop              # Target Kubernetes namespace
  labels:
    project: roboshop              # Project identifier
    tier: frontend                 # Architecture tier (Web UI / Ingress reverse proxy)
    component: frontend            # Component name
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log notice;
    pid /run/nginx.pid;

    include /usr/share/nginx/modules/*.conf;

    events {
        worker_connections 1024;
    }

    http {
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile            on;
        tcp_nopush          on;
        keepalive_timeout   65;
        types_hash_max_size 4096;

        include             /etc/nginx/mime.types;
        default_type        application/octet-stream;

        include /etc/nginx/conf.d/*.conf;

        server {
            listen       80;
            listen       [::]:80;
            server_name  _;
            root         /usr/share/nginx/html;

            include /etc/nginx/default.d/*.conf;

            # Custom error pages
            error_page 404 /404.html;
            location = /404.html {
            }

            error_page 500 502 503 504 /50x.html;
            location = /50x.html {
            }

            # Static asset caching and fallback for product images
            location /images/ {
              expires 5s;
              root   /usr/share/nginx/html;
              try_files $uri /images/placeholder.jpg;
            }

            # Microservices API Reverse-Proxy Routing:
            # Proxies requests to internal Kubernetes Services using CoreDNS service discovery:
            location /api/catalogue/ { proxy_pass http://catalogue:8080/; }
            location /api/user/      { proxy_pass http://user:8080/; }
            location /api/cart/      { proxy_pass http://cart:8080/; }
            location /api/shipping/  { proxy_pass http://shipping:8080/; }
            location /api/payment/   { proxy_pass http://payment:8080/; }

            # Internal health status endpoint
            location /health {
              stub_status on;
              access_log off;
            }
        }
    }
---
# ==============================================================================
# 2. DEPLOYMENT (Frontend Pod Management, ConfigMap Volume Mount, & Probes)
# ==============================================================================
# - Manages ReplicaSets to maintain the desired number of Pod instances.
# - Mounts the nginx.conf from the ConfigMap as a single file using subPath.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend                   # Deployment name
  namespace: roboshop              # Target namespace
  labels:
    project: roboshop
    tier: frontend
    component: frontend
spec:
  replicas: 1                      # Desired number of pod instances running
  selector:
    matchLabels:                   # Matches labels in pod template to manage them
      project: roboshop
      tier: frontend
      component: frontend
  template:                        # Blueprint for creating new Frontend pods
    metadata:
      labels:                      # Labels applied to the Pod (Matches Deployment & Service selectors)
        project: roboshop
        tier: frontend
        component: frontend
    spec:
      # Volumes definition: Declares the frontend ConfigMap as a mountable volume
      volumes:
      - name: nginx-config
        configMap:
          name: frontend           # References ConfigMap defined above
      containers:
      - name: frontend             # Container name inside the Pod
        image: joindevops/frontend:1.4.0  # Container image for static assets & Nginx
        imagePullPolicy: Always    # Always pull latest image tag to guarantee fresh code
        resources:
          requests:                # Guaranteed minimum resources reserved on Worker Node
            cpu: "100m"
            memory: "128Mi"
          limits:                  # Maximum compute resources container is allowed to consume
            cpu: "100m"
            memory: "128Mi"

        # Readiness Probe:
        # - Verifies that Nginx is accepting TCP connections on port 80 before routing traffic.
        readinessProbe:
          tcpSocket:
            port: 80
          failureThreshold: 2
          periodSeconds: 10
          initialDelaySeconds: 15

        # Liveness Probe:
        # - Checks if the Nginx web root (/) is responding with 200 OK.
        # - If unresponsive, Kubernetes automatically restarts the container.
        livenessProbe:
          httpGet:
            path: /
            port: 80
          failureThreshold: 2
          periodSeconds: 10

        # Volume Mount:
        # - Mounts the custom nginx.conf file from ConfigMap directly over /etc/nginx/nginx.conf
        # - 'subPath' ensures only that specific file is mounted without overwriting other files in /etc/nginx/
        volumeMounts:
        - name: nginx-config
          mountPath: "/etc/nginx/nginx.conf"
          subPath: nginx.conf
          readOnly: true
---
# ==============================================================================
# 3. SERVICE (Public Ingress LoadBalancer)
# ==============================================================================
# - Type: LoadBalancer provisions a public AWS Classic/Network Load Balancer (ELB)
# - Exposes the Frontend UI to the internet on standard HTTP port 80.
apiVersion: v1
kind: Service
metadata:
  name: frontend                   # Service name
  namespace: roboshop              # Target namespace
  labels:
    project: roboshop
    tier: frontend
    component: frontend
spec:
  type: LoadBalancer               # Requests AWS Cloud Controller to provision an external Load Balancer
  selector:                        # Directs external traffic to Pods matching these labels
    project: roboshop
    tier: frontend
    component: frontend
  ports:
  - protocol: TCP                  # Connection-oriented reliable transport protocol
    port: 80                       # External Load Balancer listening port
    targetPort: 80                 # Container port running Nginx inside the Pod